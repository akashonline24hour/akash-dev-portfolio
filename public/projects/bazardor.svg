<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bazardor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-bazardor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-bazardor)" />
  
  <!-- Glowing Overlay Grid -->
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#0f172a" stroke="#312e81" stroke-width="2" opacity="0.8" />
  <circle cx="400" cy="225" r="180" fill="#6366f1" opacity="0.12" filter="blur(40px)" />

  <!-- Mockup UI Cards -->
  <rect x="80" y="90" width="640" height="40" rx="10" fill="#1e293b" stroke="#334155" />
  <circle cx="110" cy="110" r="6" fill="#ef4444" />
  <circle cx="130" cy="110" r="6" fill="#f59e0b" />
  <circle cx="150" cy="110" r="6" fill="#10b981" />

  <!-- Application Text -->
  <text x="400" y="210" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="800">
    BazarDor <tspan fill="url(#accent-bazardor)">(বাজার দর)</tspan>
  </text>
  <text x="400" y="255" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="500">
    Daily Market Price Tracking Platform
  </text>

  <!-- UI Badges -->
  <rect x="230" y="300" width="100" height="32" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="280" y="321" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Next.js</text>

  <rect x="350" y="300" width="100" height="32" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
  <text x="400" y="321" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">MongoDB</text>

  <rect x="470" y="300" width="100" height="32" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5" />
  <text x="520" y="321" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Better-Auth</text>
</svg>