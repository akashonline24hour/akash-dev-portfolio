<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" width="100%" height="100%">
  <defs>
    <!-- Exact Gradient Match: Blue/Indigo -> Purple -> Bright Pink -->
    <linearGradient id="akash-logo-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />   <!-- Soft Indigo/Blue -->
      <stop offset="35%" stop-color="#A78BFA" />  <!-- Lavender/Purple -->
      <stop offset="70%" stop-color="#E879F9" />  <!-- Light Magenta -->
      <stop offset="100%" stop-color="#F43F5E" /> <!-- Bright Pink -->
    </linearGradient>
  </defs>

  <g transform="translate(20, 0)">
    <!-- Opening Bracket: < -->
    <path d="M 65 65 L 15 100 L 65 135" fill="none" stroke="url(#akash-logo-gradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Text: Akash.dev -->
    <text x="95" y="132" fill="url(#akash-logo-gradient)" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="108" font-weight="900" letter-spacing="-2">Akash.dev</text>

    <!-- Closing Slash and Bracket: /> -->
    <path d="M 605 140 L 625 60 M 645 65 L 695 100 L 645 135" fill="none" stroke="url(#akash-logo-gradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>