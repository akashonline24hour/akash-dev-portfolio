<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Blue to Pink Linear Gradient -->
    <linearGradient id="blue-pink-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />  <!-- Cyan/Blue -->
      <stop offset="50%" stop-color="#818CF8" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#EC4899" /> <!-- Bright Pink -->
    </linearGradient>

    <!-- Subtle Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Opening Bracket: < -->
    <path d="M 140 186 L 60 256 L 140 326" fill="none" stroke="url(#blue-pink-gradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter A -->
    <path d="M 195 336 L 256 166 L 317 336 M 215 276 L 297 276" fill="none" stroke="url(#blue-pink-gradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slash Symbol: / -->
    <path d="M 335 346 L 375 166" fill="none" stroke="url(#blue-pink-gradient)" stroke-width="32" stroke-linecap="round" />

    <!-- Closing Bracket: > -->
    <path d="M 392 186 L 472 256 L 392 326" fill="none" stroke="url(#blue-pink-gradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>